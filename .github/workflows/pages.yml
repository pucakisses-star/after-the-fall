name: Deploy to GitHub Pages

# Pages serves the site from a sub-path (/<repo>/), which is why vite.config.ts
# sets `base: './'` and the bundled geography is fetched with document-relative
# URLs. Both are load-bearing for this workflow — do not change them to absolute
# paths without re-testing a sub-path deployment.

on:
  push:
    branches:
      - main
      - claude/new-session-clmsm6
  workflow_dispatch:

# Allow one deployment at a time; let a run in progress finish rather than
# cancelling it half-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail the deployment on a broken build rather than publishing it.
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm run test

      - name: Build
        run: npm run build

      # `enablement: true` asks GitHub to set the Pages source to "GitHub
      # Actions". This matters because a repository left on "Deploy from a
      # branch" *also* runs GitHub's Jekyll builder, which publishes the branch
      # root — the unbuilt index.html that asks for /src/main.tsx, and no
      # bundled geography at all, because that lives under public/. Both target
      # the same site and the last to finish wins.
      #
      # Measured, not assumed: on this repository it does not take effect. The
      # Jekyll run still appears for every push (jobs `build` → `Build with
      # Jekyll` → `deploy`) and still publishes the root. What saves the site is
      # only that it finishes in ~50 s while this workflow installs, typechecks,
      # tests and builds first — so ours lands second and wins. That also means
      # any failure here leaves the raw repository live.
      #
      # The reliable fix is one manual change: Settings ▸ Pages ▸ Build and
      # deployment ▸ Source: GitHub Actions. This input is kept because it is
      # the documented way and costs nothing where the permission does apply.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Wait out GitHub's Jekyll builder before publishing.
      #
      # While the Pages source is "Deploy from a branch", that builder runs on
      # every push alongside this workflow and publishes the branch *root* — the
      # unbuilt index.html asking for /src/main.tsx, and none of the geography,
      # which lives under public/. Both target the same site and the last
      # deployment to land wins.
      #
      # Measured on this repository: the Jekyll run takes about 50 s. This
      # workflow takes 45 s with a warm npm cache and a little over two minutes
      # with a cold one — so which one lands last is a coin flip, and the site
      # has flipped to the raw repository more than once. Waiting here costs two
      # minutes of CI and makes it deterministic.
      #
      # DELETE THIS STEP once Settings ▸ Pages ▸ Source is set to GitHub
      # Actions. The Jekyll run stops entirely at that point and the wait is
      # pure delay.
      - name: Let the branch-source build finish first
        run: sleep 120

      - id: deployment
        uses: actions/deploy-pages@v4
